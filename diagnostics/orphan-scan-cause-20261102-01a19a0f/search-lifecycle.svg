<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc"><title id="title">Search lifetime and missed cleanup</title><desc id="desc">A narrow context question led to a broad search, the outer cell finished or stopped, and the native search continued until explicit cleanup.</desc><rect width="1100" height="300" fill="#f6f8fc"/><g font-family="Arial,sans-serif" fill="#15233b"><text x="36" y="38" font-size="22" font-weight="bold">One question, two different lifetimes</text><g fill="#e1ebff" stroke="#8da9d7"><rect x="36" y="72" width="220" height="92" rx="12"/><rect x="300" y="72" width="220" height="92" rx="12"/><rect x="564" y="72" width="220" height="92" rx="12"/><rect x="828" y="72" width="236" height="92" rx="12"/></g><g font-size="17"><text x="56" y="105">Find one ID / setting</text><text x="56" y="134">or existing document</text><text x="320" y="105">Broad recursive rg</text><text x="320" y="134">includes generated trees</text><text x="584" y="105">Outer cell ends</text><text x="584" y="134">child exit unverified</text><text x="848" y="105">Native rg stays alive</text><text x="848" y="134">until explicit cleanup</text></g><g stroke="#6b7c99" stroke-width="3"><path d="M260 118h32m232 0h32m232 0h32"/></g><text x="36" y="211" font-size="17">Verified example: outer cell stopped at 23:31:29; native search stopped at 02:17:58.</text><text x="36" y="241" font-size="15">Prevention: named source scope + generated-storage exclusions + retain session metadata + verify child exit.</text><text x="36" y="276" font-size="13" fill="#5a6780">Generated illustration from retained 1–2 November 2026 logs and process receipts; not a new execution capture.</text></g></svg>