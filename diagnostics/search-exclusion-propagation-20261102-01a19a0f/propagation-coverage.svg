<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d"><title id="t">Search exclusion propagation coverage</title><desc id="d">Five running chats received the instructions, twelve active automation prompts were verified, and fifty-six paused automations remained unchanged.</desc><rect width="1000" height="250" fill="#f5f8fc"/><g font-family="Arial,sans-serif" fill="#172842"><text x="28" y="38" font-size="22" font-weight="bold">Verified without stopping work</text><g fill="#e2f0e8"><rect x="28" y="63" width="296" height="128" rx="12"/><rect x="352" y="63" width="296" height="128" rx="12"/><rect x="676" y="63" width="296" height="128" rx="12"/></g><g font-size="42" font-weight="bold"><text x="54" y="116">5 / 5</text><text x="378" y="116">12 / 12</text><text x="702" y="116">56 / 56</text></g><g font-size="17"><text x="54" y="151">Running chats: rule received</text><text x="378" y="151">Active prompts: read back</text><text x="702" y="151">Paused records: unchanged</text></g><text x="28" y="227" font-size="13" fill="#53647c">Generated diagram from 2 November 2026 receipts. Rule receipt is distinct from proof of every later search.</text></g></svg>