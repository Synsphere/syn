# Merge this table into the actual configuration passed to syn-server.
# No network traffic is generated until you explicitly configure a peer.
[witnessing]
pollSeconds = 120
# Per-socket timeout and bounded response reads; OS DNS resolution uses OS limits.
timeoutSeconds = 5
peers = []

# To enable a peer, REMOVE `peers = []` above and uncomment a peer table.
# Obtain its Operator hash independently. Never copy a public key from an
# untrusted HTTP response and automatically treat it as the expected identity.
# [[witnessing.peers]]
# operator = "REPLACE_WITH_64_LOWERCASE_HEX_PUBLIC_KEY_SHA256"
# network = "syn"
# url = "https://your-other-syn-host.example"
# allowHttp = false
# Optional independently retained signed-checkpoint digest for first contact:
# initialCheckpoint = "REPLACE_WITH_64_LOWERCASE_HEX_CHECKPOINT_DIGEST"
