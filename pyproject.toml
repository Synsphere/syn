[project]
name = "syn"
version = "0.11.0"
description = "SQLAlchemy models for the Syn object-reference database"
readme = "README.md"
authors = [
    { name = "Kieran Simkin", email = "382129+kieransimkin@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "dbus-next>=0.2.3,<1; sys_platform == 'linux'",
    "bleak>=1,<3; sys_platform == 'darwin'",
    "winrt-runtime>=3,<4; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth>=3,<4; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth.Advertisement>=3,<4; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3,<4; sys_platform == 'win32'",
    "pyserial>=3.5,<4",
    "tzlocal>=5.3,<6",
    "tzdata>=2025.2",
    "geonamescache>=2,<4",
    "timezonefinder>=6.5,<9",
    "syn-client[governance]==0.11.0",
    "keyring==25.7.0",
    "mnemonic==0.21",
    "pycardano==0.19.2",
    "cbor2==5.8.0",
    "cbor2pure==5.8.0",
    "alembic>=1.18.5",
    "asyncprocessscheduler==0.9.0b1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "libp2p==0.8.1",
    "miniupnpc>=2.3.3",
    "psycopg[binary]>=3.3.4",
    "pyopenssl>=26.3.0",
    "service-identity>=26.1.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.0",
]

[project.optional-dependencies]
position-native = [
    "bleak>=1,<3",
    "dbus-next>=0.2.3,<1; sys_platform == 'linux'",
    "pyobjc-framework-CoreLocation>=11; sys_platform == 'darwin'",
    "winrt-Windows.Devices.Geolocation>=3; sys_platform == 'win32'",
]

[project.scripts]
syn-position = "syn.positions.__main__:main"
syn-radio = "syn.radios.__main__:main"
syn-server = "syn.server:main"
syn-operator = "syn.operator.__main__:main"
syn-agent = "syn.agent.__main__:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
syn-client = { path = "packages/syn-client", editable = true }


[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "database: requires a configured PostgreSQL database with the Syn schema installed",
]

[tool.coverage.run]
branch = true
source = ["syn"]
omit = [
    "src/syn/alembic/env.py",
    "src/syn/alembic/versions/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "hypothesis>=6.163.0",
    "packaging>=26.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
