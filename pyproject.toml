[project]
name = "syn"
version = "0.1.0"
description = "SQLAlchemy models for the Syn object-reference database"
readme = "README.md"
authors = [
    { name = "Kieran Simkin", email = "382129+kieransimkin@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "syn-client[governance]==0.1.0",
    "alembic>=1.18.5",
    "asyncprocessscheduler==0.9.0b1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "libp2p>=0.7.0",
    "miniupnpc>=2.3.3",
    "psycopg[binary]>=3.3.4",
    "pyopenssl>=26.3.0",
    "service-identity>=26.1.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
syn-server = "syn.server:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
syn-client = { path = "packages/syn-client", editable = true }


[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "database: requires a configured PostgreSQL database with the Syn schema installed",
]

[tool.coverage.run]
branch = true
source = ["syn"]
omit = [
    "src/syn/alembic/env.py",
    "src/syn/alembic/versions/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "hypothesis>=6.163.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
