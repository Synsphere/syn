name: Syn verification

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: syn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: false
          python-version: ${{ matrix.python }}
      - name: Install locked Syn application and test dependencies
        run: uv sync --locked --dev
      - name: Check compilation and offline migration chain
        run: uv run --locked python -m compileall -q src packages/syn-client/src
      - name: Test application, HTTP and shared contracts
        run: uv run --locked python -m pytest -q tests packages/syn-client/tests -m 'not database' -o cache_dir=.tmp-pytest/cache
      - name: Build official package candidates and hashed third-party lock
        shell: bash
        run: |
          uv build --out-dir dist
          uv build packages/syn-client --out-dir dist
          SYN_VERSION="$(uv run --locked python -c 'from importlib.metadata import version; print(version("syn"))')"
          uv export --locked --no-dev --no-emit-project --no-emit-package syn-client --no-header --output-file "dist/syn-runtime-requirements-${SYN_VERSION}.txt"
      - name: Validate unsigned release manifest against the exact clean source
        env:
          SYN_RELEASE_SOURCE: ${{ github.sha }}
        run: uv run --locked python scripts/build_release_contract.py --dist-dir dist --source-commit "$SYN_RELEASE_SOURCE"
      - name: Exercise the installed runtime wheels independently of the source tree
        shell: bash
        run: |
          uv venv dist/runtime-venv
          SYN_VERSION="$(uv run --locked python -c 'from importlib.metadata import version; print(version("syn"))')"
          uv pip install --python dist/runtime-venv --require-hashes -r "dist/syn-runtime-requirements-${SYN_VERSION}.txt"
          uv pip install --python dist/runtime-venv --no-deps dist/syn-*-py3-none-any.whl dist/syn_client-*-py3-none-any.whl
          uv run --no-project --python dist/runtime-venv python -I -m syn.server --describe-json > dist/installed-runtime.json
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          from syn_client.releases import ReleaseManifest, RuntimeContract
          manifest_file, = Path("dist").glob("syn-release-*.json")
          expected = ReleaseManifest.from_bytes(manifest_file.read_bytes()).runtime
          installed = RuntimeContract.from_dict(json.loads(Path("dist/installed-runtime.json").read_text()))
          assert installed == expected
          assert installed.node_modes == ("service",)
          PY

      - name: Retain verified unsigned release candidates for signing review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syn-unsigned-candidate-${{ github.sha }}-py${{ matrix.python }}
          # Only the five payloads and canonical unsigned manifest belong here.
          # Never upload dist/runtime-venv or treat this CI archive as a release.
          path: |
            dist/syn-*-py3-none-any.whl
            dist/syn_client-*-py3-none-any.whl
            dist/syn-*.tar.gz
            dist/syn_client-*.tar.gz
            dist/syn-runtime-requirements-*.txt
            dist/syn-release-*.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: syn_ci
          POSTGRES_PASSWORD: syn_ci_disposable_only
          POSTGRES_DB: syn_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syn_ci -d syn_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      SYN_CI_DATABASE_URL: postgresql+psycopg://syn_ci:syn_ci_disposable_only@127.0.0.1:5432/syn_ci
      SYN_COMMUNICATION_TEST_URL: postgresql+psycopg://syn_ci:syn_ci_disposable_only@127.0.0.1:5432/syn_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: false
          python-version: "3.13"
      - run: uv sync --locked --dev
      - name: Prepare disposable database and disable discovery
        env:
          SYN_CONFIG: ${{ runner.temp }}/syn-ci.toml
        run: uv run --locked python scripts/ci_database.py
      - name: Exercise PostgreSQL constraints, migrations and concurrency
        env:
          SYN_CONFIG: ${{ runner.temp }}/syn-ci.toml
        run: uv run --locked python scripts/ci_database.py --test
