name: Syn client portability

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: false
          python-version: ${{ matrix.python }}
      - name: Build and install client wheel without Syn application dependencies
        run: |
          uv build --wheel packages/syn-client --out-dir dist
          uv venv .client-venv
          uv run --no-project --python .client-venv python -c "from pathlib import Path; import subprocess; wheels=list(Path('dist').glob('syn_client-*.whl')); assert len(wheels)==1; subprocess.run(['uv','pip','install','--python','.client-venv',str(wheels[0]),'cryptography==50.0.2','pytest==9.1.1','ruff==0.17.1'],check=True)"
      - name: Check Python correctness without changing legacy formatting
        run: uv run --no-project --python .client-venv ruff check --isolated --select E4,E7,E9,F src tests packages/syn-client/src packages/syn-client/tests scripts/ci_database.py scripts/build_release_contract.py scripts/stage_release.py scripts/ci_operator_native.py scripts/ci_operator_recovery.py scripts/ci_operator_consumer.py scripts/ci_operator_release.py scripts/check_operator_hd_reference.py scripts/private_interpreter.py scripts/ci_agent_native.py scripts/prepare_agent_runtime.py scripts/ci_agent_release.py scripts/ci_lan_enrollment.py scripts/ci_private_pubsub.py scripts/ci_potbot_private_mesh.py scripts/ci_group_rollover.py
      - name: Test installed wheel on a clean import path
        run: uv run --no-project --python .client-venv python -I -m pytest -q packages/syn-client/tests -o cache_dir=.tmp-pytest/client-cache
