name: Syn native Agent acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native-agent:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SYN_AGENT_CONSUMER: 2d30849f3f13fee295e7a065b4be83c9965d07a3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kieransimkin/potbot
          ref: 2d30849f3f13fee295e7a065b4be83c9965d07a3
          path: consumer-agent
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install actual native custody and sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-user-session libgmp-dev bubblewrap uidmap libseccomp2
      - run: uv sync --locked --dev
      - name: Check real-provider protocol and fault boundaries
        run: uv run --locked python -m pytest -q tests/test_agent.py tests/test_operator.py tests/test_operator_terminal.py tests/test_operator_connections.py tests/test_pubsub.py
      - name: Build exact candidate wheels
        run: |
          uv build --wheel --out-dir artifacts/agent/wheels
          uv build --wheel packages/syn-client --out-dir artifacts/agent/wheels
      - name: Stage only a disposable root-owned copy of the candidate runtime
        shell: bash
        run: |
          sudo -E .venv/bin/python scripts/prepare_agent_runtime.py --source-prefix "$GITHUB_WORKSPACE/.venv" --wheels "$GITHUB_WORKSPACE/artifacts/agent/wheels" --destination /var/lib/potbot/syn-agent-source-runtime --uv "$(command -v uv)"
      - name: Two real nodes, native encrypted stores, full-session restarts and isolation faults
        shell: bash
        run: |
          sudo -E env -u DISPLAY -u WAYLAND_DISPLAY dbus-run-session -- /var/lib/potbot/syn-agent-source-runtime/runtime/bin/python -I -B scripts/ci_agent_native.py --consumer-dir "$GITHUB_WORKSPACE/consumer-agent" --consumer-sha "$SYN_AGENT_CONSUMER" --runtime-root /var/lib/potbot/syn-agent-source-runtime/runtime --source-wheels "$GITHUB_WORKSPACE/artifacts/agent/wheels"
      - name: Record routine CI completion assessment
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("artifacts/agent/assessment.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({"Blogworthiness": "FAIL", "reason": "Routine repeated acceptance; the Agent milestone story is assessed in its owning delivery task.", "result": os.environ["RESULT"], "source_evidence": [os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]]}) + "\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-agent-linux-py${{ matrix.python }}
          path: artifacts/agent/
          if-no-files-found: error
          retention-days: 30
